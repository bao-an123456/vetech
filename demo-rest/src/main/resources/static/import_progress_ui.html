<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工与部门 Excel 覆盖保存 - 自动实时进度面板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-sub);
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            background: rgba(15, 23, 42, 0.6);
            padding: 6px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-box {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px var(--primary-glow);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px var(--primary-glow);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* 自动弹出的模态框 Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 9999;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .progress-modal {
            width: 90%;
            max-width: 520px;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
        }

        .modal-overlay.active .progress-modal {
            transform: scale(1);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .badge .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #60a5fa;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .percent-display {
            font-size: 56px;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .progress-track {
            width: 100%;
            height: 14px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6 0%, #10b981 100%);
            border-radius: 10px;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: width 0.3s ease;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: rgba(15, 23, 42, 0.5);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .close-btn {
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Excel 数据覆盖保存 (ImportSave)</h1>
            <p>智能检测存量数据自动 UPDATE，全新数据自动 INSERT</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tabEmp" onclick="switchType('emp')">员工数据覆盖保存</button>
            <button class="tab-btn" id="tabDept" onclick="switchType('dept')">部门数据覆盖保存</button>
        </div>

        <div class="form-group">
            <label>后端服务基准地址 (Server Base URL)</label>
            <input type="text" class="input-box" id="serverBaseUrl" placeholder="如 http://localhost:12345">
        </div>

        <div class="form-group">
            <label id="urlLabel">Excel 文件地址 (本地路径如 F:\dep.xlsx 或 网络URL)</label>
            <input type="text" class="input-box" id="fileUrl" value="F:\dep.xlsx" placeholder="例如 F:\dep.xlsx 或 http://localhost:12345/demo.xlsx">
        </div>

        <button class="submit-btn" onclick="startImportSave()">一键开启覆盖保存导入 (自动弹出进度框)</button>
    </div>

    <!-- 自动弹出的进度框 Process Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="progress-modal">
            <div class="badge" id="statusBadge">
                <div class="spinner" id="spinner"></div>
                <span id="statusText">正在对比索引与分批落库中...</span>
            </div>

            <div class="percent-display" id="percentText">0%</div>

            <div class="progress-track">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="recordsText">0 / 0</div>
                    <div class="stat-label">已处理 / 总记录数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="costTimeText">0 ms</div>
                    <div class="stat-label">耗时</div>
                </div>
            </div>

            <button class="close-btn" id="closeBtn" style="display: none;" onclick="closeModal()">完成并关闭窗口</button>
        </div>
    </div>

    <script>
        let currentType = 'emp';
        let pollTimer = null;
        let activeTaskId = null;

        // 初始化基准服务地址
        window.addEventListener('DOMContentLoaded', () => {
            const serverInput = document.getElementById('serverBaseUrl');
            if (window.location.protocol.startsWith('http')) {
                serverInput.value = window.location.origin;
            } else {
                serverInput.value = 'http://localhost:12345';
            }
        });

        function getBaseUrl() {
            let url = document.getElementById('serverBaseUrl').value.trim();
            if (!url) {
                url = 'http://localhost:12345';
            }
            return url.replace(/\/+$/, '');
        }

        function switchType(type) {
            currentType = type;
            document.getElementById('tabEmp').classList.toggle('active', type === 'emp');
            document.getElementById('tabDept').classList.toggle('active', type === 'dept');
            document.getElementById('urlLabel').innerText = type === 'emp' ? '员工 Excel 文件地址 (FileUrl)' : '部门 Excel 文件地址 (FileUrl)';
            const baseUrl = getBaseUrl();
            document.getElementById('fileUrl').value = type === 'emp' ? `${baseUrl}/demo_emp.xlsx` : `${baseUrl}/demo_dept.xlsx`;
        }

        async function startImportSave() {
            const fileUrl = document.getElementById('fileUrl').value.trim();
            if (!fileUrl) {
                alert("请输入 Excel 文件地址！");
                return;
            }

            const baseUrl = getBaseUrl();

            // 1. 自动弹出进度框
            openModal();

            // 2. 发起异步 Save 导入请求
            const apiPath = currentType === 'emp' ? '/fccapi/DEMO_B2G_ImportSaveVeEmp' : '/fccapi/DEMO_B2G_ImportSaveVeDept';
            try {
                const res = await fetch(baseUrl + apiPath, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        request: { fileUrl: fileUrl },
                        openApiUserVO: { qybh: 'VETECH', ygid: 'ADMIN' }
                    })
                });
                const data = await res.json();

                if (data && data.response && data.response.taskId) {
                    activeTaskId = data.response.taskId;
                    // 3. 自动开启智能进度跟踪
                    startAutoPolling(baseUrl, activeTaskId);
                } else {
                    document.getElementById('statusText').innerText = "请求异常：" + (data.message || (data.status ? "HTTP " + data.status : "接口未找到"));
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('closeBtn').style.display = 'inline-block';
                }
            } catch (err) {
                console.error("请求失败", err);
                document.getElementById('statusText').innerText = "网络通信异常 (请确认地址与跨域)";
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('closeBtn').style.display = 'inline-block';
            }
        }

        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('percentText').innerText = '0%';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('recordsText').innerText = '0 / 0';
            document.getElementById('costTimeText').innerText = '0 ms';
            document.getElementById('statusText').innerText = '正在对比索引与分批落库中...';
            document.getElementById('spinner').style.display = 'inline-block';
            document.getElementById('closeBtn').style.display = 'none';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            if (pollTimer) clearInterval(pollTimer);
        }

        function startAutoPolling(baseUrl, taskId) {
            if (pollTimer) clearInterval(pollTimer);

            pollTimer = setInterval(async () => {
                try {
                    const res = await fetch(baseUrl + '/fccapi/DEMO_B2G_QueryImportProgress', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            request: { taskId: taskId },
                            openApiUserVO: { qybh: 'VETECH', ygid: 'ADMIN' }
                        })
                    });
                    const data = await res.json();
                    if (data && data.response) {
                        updateModalUI(data.response);
                    }
                } catch (e) {
                    console.error("进度轮询异常", e);
                }
            }, 500);
        }

        function updateModalUI(info) {
            const percent = info.percent || 0;
            document.getElementById('percentText').innerText = percent + '%';
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('recordsText').innerText = (info.processedCount || 0) + ' / ' + (info.totalCount || 0);
            document.getElementById('costTimeText').innerText = (info.costTime || 0) + ' ms';

            if (info.status === '3') {
                document.getElementById('statusText').innerText = '数据覆盖保存导入成功 (100%)';
                document.getElementById('statusBadge').style.background = 'rgba(16, 185, 129, 0.2)';
                document.getElementById('statusBadge').style.color = '#10b981';
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('closeBtn').style.display = 'inline-block';
                if (pollTimer) clearInterval(pollTimer);
            } else if (info.status === '4') {
                document.getElementById('statusText').innerText = '数据导入失败，请检查文件与日志';
                document.getElementById('statusBadge').style.background = 'rgba(239, 68, 68, 0.2)';
                document.getElementById('statusBadge').style.color = '#f87171';
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('closeBtn').style.display = 'inline-block';
                if (pollTimer) clearInterval(pollTimer);
            }
        }
    </script>
</body>
</html>
